# ==============================================================================
# NGINX Plus Production Configuration with Full Observability & Telemetry
# ==============================================================================
# Designed for high-performance L7 (HTTP/HTTPS) and L4 (TCP/UDP Stream) traffic,
# exposing real-time metrics for the NGINX Plus Prometheus Exporter.
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# ==============================================================================
# HTTP Layer 7 Reverse Proxy & Virtual Hosts
# ==============================================================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream DNS Resolver for dynamic resolution of public internet targets
    resolver 1.1.1.1 8.8.8.8 9.9.9.9 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Shared Memory Zones for Rate & Connection Limiting (Matches Dashboard Metrics)
    limit_conn_zone $binary_remote_addr zone=allowed_ports:10m;
    limit_req_zone $binary_remote_addr zone=allowed_fqdn:10m rate=100r/s;

    # Log formats
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Upstream Group 1: test-upstream (Primary Public HTTP Targets)
    # --------------------------------------------------------------------------
    upstream test-upstream {
        # Shared memory zone for upstream telemetry & dynamic reconfiguration
        zone test-upstream 512k;

        # Public internet backends
        server httpbin.org:80 max_fails=3 fail_timeout=10s;
        server example.com:80 max_fails=3 fail_timeout=10s;
        
        # Simulated offline backup server (to demonstrate DOWN state in Grafana)
        server 192.168.2.26:80 max_fails=2 fail_timeout=10s backup;

        # Keepalive connection pool to backends
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Upstream Group 2: api-backend (Fast Public Cloudflare Anycast Targets)
    # --------------------------------------------------------------------------
    upstream api-backend {
        zone api_backend 512k;

        server 1.1.1.1:80 max_fails=3 fail_timeout=10s;
        server 1.0.0.1:80 max_fails=3 fail_timeout=10s;

        keepalive 16;
    }

    # --------------------------------------------------------------------------
    # Server 1: NGINX Plus Live API & Management Dashboard (Port 8080)
    # Scraped by nginx-prometheus-exporter at http://127.0.0.1:8080/api
    # --------------------------------------------------------------------------
    server {
        listen 8080;
        server_name localhost;
        status_zone api_admin;

        # NGINX Plus API for telemetry and dynamic reconfiguration
        location /api {
            api write=on;
            # In production, restrict to monitoring server / exporter IP:
            # allow 127.0.0.1;
            # deny all;
        }

        # Built-in NGINX Plus Live HTML Dashboard
        location = /dashboard.html {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 /dashboard.html;
        }
    }

    # --------------------------------------------------------------------------
    # Server 2: Primary Web & API Frontend (Port 80)
    # Matches Dashboard Server Zone: "11111"
    # --------------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;
        
        # Enables per-server-zone telemetry in Grafana
        status_zone 11111;

        # Apply connection & request rate limiting from shared memory slab
        limit_conn allowed_ports 50;
        limit_req zone=allowed_fqdn burst=30 nodelay;

        # Default route -> Proxies to test-upstream (httpbin.org / example.com)
        location / {
            proxy_pass http://test-upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host httpbin.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_500 http_502 http_503;

            # Active synthetic health check probe (managed by NGINX Plus)
            health_check interval=5s fails=3 passes=2 uri=/status/200;
        }

        # Secondary API route -> Proxies to api-backend
        location /api/v1/ {
            proxy_pass http://api-backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host 1.1.1.1;

            health_check interval=5s fails=3 passes=2;
        }

        # Latency / TTFB testing endpoint (returns with 1-second delay from httpbin)
        location /delay {
            proxy_pass http://test-upstream/delay/1;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host httpbin.org;
        }

        # Status Code Emulation (Generates diverse 4xx/5xx metrics for Grafana)
        location /status/200 { return 200 '{"status": 200, "message": "OK"}'; }
        location /status/201 { return 201 '{"status": 201, "message": "Created"}'; }
        location /status/204 { return 204; }
        location /status/301 { return 301 https://$host$request_uri; }
        location /status/302 { return 302 /status/200; }
        location /status/400 { return 400 '{"error": 400, "message": "Bad Request"}'; }
        location /status/401 { return 401 '{"error": 401, "message": "Unauthorized"}'; }
        location /status/403 { return 403 '{"error": 403, "message": "Forbidden"}'; }
        location /status/404 { return 404 '{"error": 404, "message": "Resource Not Found"}'; }
        location /status/429 { return 429 '{"error": 429, "message": "Too Many Requests"}'; }
        location /status/500 { return 500 '{"error": 500, "message": "Internal Server Error"}'; }
        location /status/502 { return 502 '{"error": 502, "message": "Bad Gateway"}'; }
        location /status/503 { return 503 '{"error": 503, "message": "Service Unavailable"}'; }
        location /status/504 { return 504 '{"error": 504, "message": "Gateway Timeout"}'; }
    }

    # --------------------------------------------------------------------------
    # Server 3: SSL / TLS Secure Frontend (Port 8443)
    # Feeds SSL handshake, session reuse, and cipher metrics
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl default_server;
        server_name _;
        status_zone ssl_frontend;

        # TLS Certificates (self-signed or valid certificates)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Session caching & resumption (enables nginxplus_ssl_session_reuses metrics)
        ssl_session_cache shared:SSL_CACHE:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets on;

        location / {
            proxy_pass http://test-upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host example.com;
        }

        location /status/200 {
            return 200 '{"secure": true, "tls_protocol": "$ssl_protocol"}';
        }
    }
}

# ==============================================================================
# Stream Layer 4 (TCP/UDP) Reverse Proxy & Load Balancing
# ==============================================================================
stream {
    # DNS Resolver for dynamic stream backends
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Stream Upstream: dns (Public Anycast DNS Resolvers)
    # Matches Dashboard Metrics: upstream="dns"
    # --------------------------------------------------------------------------
    upstream dns_tcp {
        # Shared memory zone for stream upstream telemetry
        zone dns 512k;

        # Public high-availability DNS resolvers (TCP port 53)
        server 1.1.1.1:53 max_fails=3 fail_timeout=10s;
        server 8.8.8.8:53 max_fails=3 fail_timeout=10s;
        server 9.9.9.9:53 max_fails=3 fail_timeout=10s;

        # Simulated offline backup server (matches user's metrics snippet)
        server 192.168.2.13:53 max_fails=2 fail_timeout=10s backup;
    }

    upstream dns_udp {
        zone dns_udp 512k;

        server 1.1.1.1:53 max_fails=3 fail_timeout=10s;
        server 8.8.8.8:53 max_fails=3 fail_timeout=10s;
        server 9.9.9.9:53 max_fails=3 fail_timeout=10s;
    }

    # --------------------------------------------------------------------------
    # Stream Server 1: TCP Stream Proxy (Port 20053)
    # Matches Dashboard Stream Zone: "20053"
    # --------------------------------------------------------------------------
    server {
        listen 20053;
        status_zone 20053;

        proxy_pass dns_tcp;
        proxy_connect_timeout 2s;
        proxy_timeout 10s;

        # Active stream health check probe
        health_check interval=5s passes=2 fails=3;
    }

    # --------------------------------------------------------------------------
    # Stream Server 2: UDP Stream Proxy (Port 20053 UDP)
    # --------------------------------------------------------------------------
    server {
        listen 20053 udp;
        status_zone 20053_udp;

        proxy_pass dns_udp;
        proxy_responses 1;
        proxy_timeout 5s;

        health_check interval=5s passes=2 fails=3;
    }

    # --------------------------------------------------------------------------
    # Stream Server 3: Generic TCP Proxy (Port 20080 -> HTTP Backends via L4)
    # --------------------------------------------------------------------------
    upstream http_l4_backends {
        zone http_l4 256k;
        server 93.184.215.14:80 max_fails=3 fail_timeout=10s; # example.com IP
        server 1.1.1.1:80 max_fails=3 fail_timeout=10s;        # cloudflare IP
    }

    server {
        listen 20080;
        status_zone stream_l4_proxy;
        proxy_pass http_l4_backends;
        proxy_connect_timeout 2s;
        proxy_timeout 15s;
    }
}
